name: NewAPI 自动签到

on:
  # 定时执行：每天 UTC 0:10 (北京时间 8:10)
  schedule:
    - cron: '10 0 * * *'
  # 手动触发
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 安装 Playwright 浏览器
        run: playwright install chromium --with-deps

      - name: 执行签到
        env:
          CONFIG_URL: ${{ secrets.CONFIG_URL }}
          CONFIG_AUTH: ${{ secrets.CONFIG_AUTH }}
          NEWAPI_ACCOUNTS: ${{ secrets.NEWAPI_ACCOUNTS }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          # 邮件通知：兼容 EMAIL_* 与 SMTP_* 两套 Secret 命名
          EMAIL_SMTP_HOST: ${{ secrets.EMAIL_SMTP_HOST || secrets.SMTP_HOST }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT || secrets.SMTP_PORT }}
          EMAIL_USER: ${{ secrets.EMAIL_USER || secrets.SMTP_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS || secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO || secrets.SMTP_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM || secrets.SMTP_USER }}
          NOTIFY_ONLY_FAILURE: ${{ secrets.NOTIFY_ONLY_FAILURE }}
        # xvfb-run 提供虚拟 X server，否则 Playwright 有头模式无法启动
        run: xvfb-run --auto-servernum python checkin.py
